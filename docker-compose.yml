services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: researchloop
      POSTGRES_PASSWORD: researchloop
      POSTGRES_DB: researchloop
    ports:
      - "5432:5432"
    volumes:
      - researchloop_pg:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  researchloop_pg:
